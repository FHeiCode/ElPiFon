name: APK bauen

on:
  push:
    branches: [main]
    tags: ["v*"]          # z. B. v1.0.0 → erzeugt zusätzlich ein GitHub-Release
    # Außerdem: Steht in version.txt eine neue Nummer, legt ein Push auf main das Release an.
  pull_request:
  workflow_dispatch:       # Manuell starten über "Actions" → "Run workflow"

permissions:
  contents: write          # nötig, um Releases anzulegen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Version festlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          FILE_VERSION=$(tr -d ' \r\n' < version.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            echo "VERSION_NAME=${FILE_VERSION}" >> "$GITHUB_ENV"
            # Neue Versionsnummer in version.txt → automatisch ein Release anlegen.
            if gh release view "v${FILE_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release v${FILE_VERSION} gibt es schon – kein neues Release."
            else
              echo "AUTO_RELEASE=true" >> "$GITHUB_ENV"
              echo "Neue Version ${FILE_VERSION} – Release wird angelegt."
            fi
          else
            echo "VERSION_NAME=${FILE_VERSION}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Signaturschlüssel aus Secrets laden
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signierter Release-Build."
          else
            echo "::warning::Kein KEYSTORE_BASE64-Secret gesetzt – es wird eine Debug-APK gebaut. Updates über eine ältere Installation funktionieren dann nicht."
          fi

      - name: APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$SIGNING_STORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            SRC=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew --no-daemon assembleDebug
            SRC=app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p dist
          cp "$SRC" "dist/ElPiFon-${VERSION_NAME}.apk"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ElPiFon-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: GitHub-Release anlegen (Tag v* oder neue Version in version.txt)
        if: startsWith(github.ref, 'refs/tags/v') || env.AUTO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: ElPiFon ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
